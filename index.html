<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10131c" />
    <title>Leaf Runner</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Mossy Valley</p>
          <h1>LEAF <span>RUNNER</span></h1>
        </div>
        <div class="topbar-actions">
          <button id="sound-button" class="icon-button" type="button" aria-label="Toggle sound">
            <span id="sound-icon">♪</span>
          </button>
          <button id="pause-button" class="icon-button" type="button" aria-label="Pause game">
            <span id="pause-icon">Ⅱ</span>
          </button>
        </div>
      </header>

      <section class="game-layout">
        <aside class="stats-panel">
          <div class="stat-card">
            <span class="stat-label">Score</span>
            <strong id="score">0000</strong>
          </div>
          <div class="stat-card">
            <span class="stat-label">Best</span>
            <strong id="best-score">0000</strong>
          </div>
          <div class="stat-card level-card">
            <span class="stat-label">Level</span>
            <strong id="level">1</strong>
            <div class="level-track"><span id="level-progress"></span></div>
          </div>
        </aside>

        <div class="board-wrap">
          <canvas id="game-canvas" width="840" height="600" aria-label="Leaf Runner platform game board"></canvas>

          <div id="start-overlay" class="overlay">
            <div class="overlay-content">
              <p class="eyebrow">Ready to explore?</p>
              <h2>Collect coins.<br />Reach the flag.</h2>
              <button id="start-button" class="primary-button" type="button">Start run</button>
              <p class="control-help">Arrow keys / WASD / swipe</p>
            </div>
          </div>

          <div id="pause-overlay" class="overlay hidden">
            <div class="overlay-content">
              <p class="eyebrow">Run paused</p>
              <h2>Take a breath.</h2>
              <button id="resume-button" class="primary-button" type="button">Resume</button>
            </div>
          </div>

          <div id="gameover-overlay" class="overlay hidden">
            <div class="overlay-content">
              <p class="eyebrow">Run complete</p>
              <h2 id="gameover-title">Good run!</h2>
              <p id="final-score" class="final-score">Score 0000</p>
              <button id="restart-button" class="primary-button" type="button">Play again</button>
            </div>
          </div>
        </div>
      </section>

      <nav class="mobile-controls" aria-label="Direction controls">
        <button type="button" data-direction="up" aria-label="Move up">↑</button>
        <button type="button" data-direction="left" aria-label="Move left">←</button>
        <button type="button" data-direction="down" aria-label="Move down">↓</button>
        <button type="button" data-direction="right" aria-label="Move right">→</button>
      </nav>
    </main>

    <script src="./game.js"></script>
  </body>
</html>
